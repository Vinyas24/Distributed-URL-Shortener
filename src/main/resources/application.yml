spring:
  application:
    name: url-shortener
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/urlshortener}
    username: ${DB_USERNAME:urlshortener}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: url-shortener-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:2000}
      validation-timeout: 1000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:500ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}
      repositories:
        enabled: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    whitelabel:
      enabled: false
  tomcat:
    threads:
      max: 200
    connection-timeout: 5s
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  id-generator:
    worker-id: ${WORKER_ID:}
    max-backward-wait-ms: ${ID_MAX_BACKWARD_WAIT_MS:1000}
  cache:
    enabled: ${CACHE_ENABLED:true}
    redirect-ttl: ${CACHE_REDIRECT_TTL:1h}
    negative-ttl: ${CACHE_NEGATIVE_TTL:30s}
    key-prefix: "${CACHE_KEY_PREFIX:url:redirect:}"
  analytics:
    enabled: ${ANALYTICS_ENABLED:true}
    queue-capacity: ${ANALYTICS_QUEUE_CAPACITY:10000}
    batch-size: ${ANALYTICS_BATCH_SIZE:500}
    flush-interval-ms: ${ANALYTICS_FLUSH_INTERVAL_MS:500}
    ip-hash-salt: ${IP_HASH_SALT:local-dev-salt}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    fail-open: ${RATE_LIMIT_FAIL_OPEN:true}
    key-prefix: "${RATE_LIMIT_KEY_PREFIX:rate:create:}"
    create:
      capacity: ${RATE_LIMIT_CREATE_CAPACITY:20}
      refill-per-second: ${RATE_LIMIT_CREATE_REFILL_PER_SECOND:5}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        urlshortener.create.duration: true
        urlshortener.redirect.duration: true
      sla:
        http.server.requests: 10ms,25ms,50ms,100ms,250ms,500ms
        urlshortener.create.duration: 10ms,25ms,50ms,100ms
        urlshortener.redirect.duration: 5ms,10ms,25ms,50ms,100ms
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: Distributed URL shortener

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  structured:
    format:
      console: ${LOGGING_STRUCTURED_FORMAT_CONSOLE:}
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.vinyas.urlshortener: INFO
