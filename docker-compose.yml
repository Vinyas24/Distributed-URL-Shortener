services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: urlshortener
      POSTGRES_PASSWORD: ${DB_PASSWORD:-urlshortener}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urlshortener -d urlshortener"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: >
      redis-server
        --save 60 1
        --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api-1: &api-base
    image: url-shortener:latest
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      WORKER_ID: "1"
      DB_URL: jdbc:postgresql://postgres:5432/urlshortener
      DB_USERNAME: urlshortener
      DB_PASSWORD: ${DB_PASSWORD:-urlshortener}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      IP_HASH_SALT: ${IP_HASH_SALT:-change-me-in-prod}
      ANALYTICS_ENABLED: "true"
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_FAIL_OPEN: "true"
      LOGGING_STRUCTURED_FORMAT_CONSOLE: "logstash"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768m
    restart: on-failure

  api-2:
    <<: *api-base
    environment:
      SPRING_PROFILES_ACTIVE: prod
      WORKER_ID: "2"
      DB_URL: jdbc:postgresql://postgres:5432/urlshortener
      DB_USERNAME: urlshortener
      DB_PASSWORD: ${DB_PASSWORD:-urlshortener}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      IP_HASH_SALT: ${IP_HASH_SALT:-change-me-in-prod}
      ANALYTICS_ENABLED: "true"
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_FAIL_OPEN: "true"
      LOGGING_STRUCTURED_FORMAT_CONSOLE: "logstash"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
      web:
        condition: service_started
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/actuator/health | grep -q UP || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    image: url-shortener-web:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-8081}:80"
    depends_on:
      - api-1
      - api-2
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    restart: on-failure

  grafana:
    image: grafana/grafana:10.4.1
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: on-failure

volumes:
  postgres-data:
  redis-data:
