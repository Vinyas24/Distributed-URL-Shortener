upstream backend_gateway {
    server nginx:80;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Static assets with aggressive immutable caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Backend API endpoints: proxy to backend
    location /api/ {
        proxy_pass http://backend_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend Actuator & Swagger endpoints: proxy to backend
    location /actuator/ {
        proxy_pass http://backend_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /swagger-ui/ {
        proxy_pass http://backend_gateway;
        proxy_set_header Host $host;
    }

    location /v3/api-docs {
        proxy_pass http://backend_gateway;
        proxy_set_header Host $host;
    }

    # SPA Routes: fall back to index.html ONLY for designated SPA routes
    location = / {
        try_files /index.html =404;
    }

    location ^~ /dashboard {
        try_files $uri /index.html =404;
    }

    location ^~ /links/ {
        try_files $uri /index.html =404;
    }

    location ^~ /stats/ {
        try_files $uri /index.html =404;
    }

    location ^~ /login {
        try_files $uri /index.html =404;
    }

    location ^~ /expired {
        try_files $uri /index.html =404;
    }

    # Short-code paths: route directly to backend for fast redirect
    location ~ ^/[A-Za-z0-9_-]+$ {
        proxy_pass http://backend_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Default fallback
    location / {
        try_files $uri $uri/ =404;
    }
}
