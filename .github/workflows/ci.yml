name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (Java 21 + Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify Docker environment
        run: |
          docker --version
          docker compose version

      - name: Run Unit and Integration Tests (Testcontainers)
        run: mvn -B clean test --no-transfer-progress

      - name: Package JAR
        run: mvn -B package -DskipTests --no-transfer-progress

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  docker:
    name: Build & Verify Docker Image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Application Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: url-shortener:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Docker Compose Config
        run: |
          docker compose config

      - name: Compose Stack Smoke Test
        run: |
          docker compose up -d --build
          echo "Waiting for services to become healthy..."
          timeout 120s bash -c 'until [ $(docker compose ps -q | wc -l) -eq 7 ] && ! docker compose ps | grep -q "starting\|unhealthy"; do sleep 3; done' || (docker compose ps && docker compose logs && exit 1)
          docker compose ps
          # Verify health probe through Nginx
          curl -sf http://localhost/actuator/health | grep -q '"status":"UP"'
          # Smoke create and redirect
          RESP=$(curl -sf -X POST http://localhost/api/v1/urls -H "Content-Type: application/json" -d '{"originalUrl":"https://example.com/ci-smoke"}')
          echo "Created URL: $RESP"
          CODE=$(echo "$RESP" | python3 -c "import sys, json; print(json.load(sys.stdin)['shortCode'])")
          curl -sv "http://localhost/$CODE" 2>&1 | grep -q "302 Found\|Location: https://example.com/ci-smoke"
          echo "Smoke test passed successfully!"
          docker compose down -v
