worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time ut=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_types         application/json text/plain text/css application/javascript;

    upstream api_upstream {
        least_conn;
        server api-1:8080 max_fails=3 fail_timeout=5s;
        server api-2:8080 max_fails=3 fail_timeout=5s;
        keepalive 32;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout  5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;

        proxy_buffer_size          16k;
        proxy_buffers              4 32k;
        proxy_busy_buffers_size    64k;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Redirect GET path: retry on next replica if one replica fails or is killed
        location ~ ^/[A-Za-z0-9_-]+$ {
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_pass http://api_upstream;
        }

        # All other paths (POST /api/v1/urls, Actuator, etc.): no retry on failure
        location / {
            proxy_next_upstream off;
            proxy_pass http://api_upstream;
        }
    }
}
